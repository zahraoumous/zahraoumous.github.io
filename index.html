<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zahra Oumous – Senior Data Analyst</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f7f4;--card:#fff;--ink:#12251a;--muted:#4f6357;--line:#d5e2d9;--g:#0f5a2a;--g2:#1f8a45;--mint:#d9f5e2;--on-g:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1711;--card:#14231a;--ink:#e6f0e9;--muted:#9bb0a2;--line:#27402f;--g:#4cc27a;--g2:#4cc27a;--mint:#1b3a27;--on-g:#0d1711}}
:root[data-theme="dark"]{--bg:#0d1711;--card:#14231a;--ink:#e6f0e9;--muted:#9bb0a2;--line:#27402f;--g:#4cc27a;--g2:#4cc27a;--mint:#1b3a27;--on-g:#0d1711}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.6 "Segoe UI",Tahoma,"Helvetica Neue",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
a{color:inherit}:focus-visible{outline:3px solid var(--g2);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);box-shadow:0 1px 12px rgba(15,60,30,.08)}
.bar{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none}
.brand b{display:block;font-size:1.25rem;line-height:1.1}.brand small{color:var(--muted);font-size:.82rem}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 12px;text-decoration:none;font-weight:500;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:var(--g);border-color:var(--g)}
.tools{display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{font:inherit;font-size:.85rem;font-weight:600;background:transparent;color:var(--muted);border:0;padding:7px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--g);color:var(--on-g)}
.btn{display:inline-block;background:var(--g);color:var(--on-g);padding:12px 22px;border-radius:10px;text-decoration:none;font:inherit;font-weight:600;border:2px solid var(--g);cursor:pointer;text-align:center}
.btn.out{background:transparent;color:var(--g)}.btn.sm{padding:9px 18px;font-size:.95rem}
main{max-width:1180px;margin:auto;padding:44px 20px 70px}
.view{display:none}.view.on{display:block}
.pill{display:inline-block;background:var(--mint);color:var(--g);font-weight:600;padding:6px 18px;border-radius:999px;margin-bottom:16px}
h1{font-size:clamp(2.1rem,5.6vw,3.5rem);line-height:1.12;letter-spacing:-.01em;margin:0 0 16px}
h3{font-size:1.2rem;line-height:1.3;margin:14px 0 8px}
p{max-width:62ch;margin:0 0 1em}.lead{font-size:1.25rem;color:var(--muted);max-width:46ch}
.rule{width:80px;height:5px;background:var(--g);border-radius:3px;margin:22px 0 34px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(15,60,30,.07)}
.card.hl{background:linear-gradient(160deg,var(--mint),var(--card))}
.card svg{width:44px;height:44px;stroke:var(--g);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card p{color:var(--muted);font-size:.97rem}
.ck{list-style:none;padding:0;margin:0 0 22px;flex:1;font-size:.95rem}
.ck li{padding:5px 0;padding-inline-start:28px;position:relative}
.ck li::before{content:"✓";position:absolute;inset-inline-start:0;top:7px;width:19px;height:19px;border-radius:50%;background:var(--g2);color:#fff;font-size:.7rem;display:grid;place-items:center}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:14px}
.stat b{font-size:1.6rem;color:var(--g);display:block;line-height:1.2}.stat span{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.proj{display:grid;grid-template-columns:380px 1fr;gap:28px;padding:28px 0;border-top:1px solid var(--line)}
.proj img{width:100%;height:auto;border-radius:14px;border:1px solid var(--line);display:block;background:var(--card)}
.proj ul{padding-inline-start:20px;margin:0 0 16px;color:var(--muted)}.proj li{margin-bottom:6px}
.tags{display:flex;gap:8px;flex-wrap:wrap}.tags span{background:var(--mint);color:var(--g);font-size:.85rem;font-weight:600;padding:3px 12px;border-radius:999px}
.split{display:grid;grid-template-columns:1.3fr 1fr;gap:40px}
.links a{display:block;padding:4px 0;color:var(--g);font-weight:600;overflow-wrap:anywhere}
form{display:grid;gap:16px;max-width:660px;margin-top:20px}
label{display:grid;gap:6px;font-weight:600;font-size:.95rem}
input,select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
textarea{min-height:120px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#result{display:none;margin-top:24px;max-width:660px;background:var(--card);border:2px solid var(--g2);border-radius:14px;padding:20px}
#result pre{white-space:pre-wrap;font:inherit;margin:0 0 14px}#note{color:var(--g);font-weight:600;min-height:1.4em;margin-top:8px}
footer{text-align:center;color:var(--muted);padding:24px;border-top:1px solid var(--line);font-size:.9rem}
footer a{color:var(--g);font-weight:600;margin:0 8px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.proj{grid-template-columns:1fr}}
@media (max-width:720px){.grid,.two,.hero,.split{grid-template-columns:1fr}}
</style>
</head>

<a class="brand" href="#home"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="22" width="9" height="16" rx="2" fill="#0f5a2a"/><rect x="15" y="12" width="9" height="26" rx="2" fill="#1f8a45"/><rect x="28" y="2" width="9" height="36" rx="2" fill="#0f5a2a"/></svg><span><b>Zahra Oumous</b><small id="role"></small></span></a>

</div></header>
